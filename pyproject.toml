[build-system]
requires = ["uv_build>=0.11.29,<0.12"]
build-backend = "uv_build"

[project]
name = "knbn"
version = "0.0.1"
description = "A terminal-native personal Kanban board"
license = "Apache-2.0"
readme = "README.md"
keywords = ["python", "kanban", "terminal", "task-management"]
homepage = "https://github.com/BastiTee/knbn"
repository = "https://github.com/BastiTee/knbn"
authors = [
  {name = "Basti Tee", email = "basti.tee@icloud.com"}
]
maintainers = [
  {name = "Basti Tee", email = "basti.tee@icloud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]
# Python version: https://www.python.org/downloads/
requires-python = ">=3.10,<3.15"
dependencies = [
    "textual>=0.80.0",
    "click>=8.1.0",
]

[project.scripts]
knbn = 'knbn.__main__:main'

[tool.uv.build-backend]
module-root = "src"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pip-audit>=2.10.1",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-randomly>=4.1.0",
    "ruff>=0.15.22",
]

[tool.mypy]
# Untyped definitions and calls
# Disallows defining functions without type annotations or with
# incomplete type annotations.
disallow_untyped_defs = true
# Type-checks the interior of functions without type annotations
check_untyped_defs = true
# Import discovery
follow_imports = "normal"
ignore_missing_imports = true
mypy_path = "src"
# Warning configuration
warn_unused_ignores = true
warn_unreachable = true
warn_return_any = true
# Stricter checks
no_implicit_reexport = true
strict_equality = true
# Error message config
# pretty = true

[tool.pytest.ini_options]
addopts = [
  "-p", "no:warnings",
  "--import-mode=importlib",
  "--cov=knbn",
  "--cov-report=term-missing",
  "--cov-fail-under=95",
  "--randomly-seed=last",
]
testpaths = ["tests"]
pythonpath = ["src"]
xfail_strict = true

[tool.coverage.run]
omit = [
    "*/__main__.py",
    "*/app.py",
    "*/views/*",
    "*/widgets/*",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (common bugs + opinionated style)
    "C4",   # flake8-comprehensions (idiomatic comprehensions)
    "BLE",  # flake8-blind-except
    "A",    # flake8-builtins
    "PTH",  # flake8-use-pathlib (prefer pathlib over os.path)
    "RUF",  # Ruff-native rules
    "S",    # flake8-bandit (security)
    "PERF", # flake8-perflint (performance anti-patterns)
    "SIM",  # flake8-simplify (simplifiable code patterns)
    "TCH",  # flake8-type-checking (move imports to TYPE_CHECKING block)
    "ERA",  # eradicate (flag commented-out code)
    "T20",  # flake8-print (catch stray print() calls)
    "PLC",  # pylint conventions
    "PLE",  # pylint errors
    "PLR",  # pylint refactoring
    "PLW",  # pylint warnings
    "G",    # flake8-logging-format
    "TRY",  # tryceratops (try/except patterns)
]
ignore = [
    "E203",    # whitespace before colon (Black-compatible)
    "E501",    # line too long — formatter handles this
    "S101",    # allow assert in tests (also set per-file below)
    "TRY003",  # allow long exception messages
    "PLR2004", # allow magic values in comparisons (too noisy)
    "PLR0913", # too many arguments — Textual widgets need many
    "RUF012",  # mutable class attrs — normal pattern for Textual BINDINGS/CSS
    "PLC0415", # imports not at top-level — deferred TUI imports avoid circular deps
    "TC001",   # TYPE_CHECKING imports — not needed with from __future__ import annotations
    "TC002",   # same for third-party
    "TC003",   # same for stdlib
    "RUF001",  # ambiguous unicode — intentional (×, –) in user-facing strings
    "RUF002",  # ambiguous unicode in docstrings
    "S607",    # partial executable path — intentional for $EDITOR / open
    "ERA001",  # commented-out code — pragma: no cover lines
    "PERF203", # try-except in loop — acceptable in parsing utilities
    "B905",    # zip strict — not needed for simple paired iterations
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]       # allow assert in test files
"**/__main__.py" = ["T201"]      # allow print() in CLI entry points
"**/cli.py" = ["T201"]           # allow print() in CLI commands

[tool.ruff.format]
quote-style = "preserve"
preview = true
